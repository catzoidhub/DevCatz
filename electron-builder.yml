appId: com.mrcatz.devcatz
productName: DevCatz
copyright: Copyright © 2026 Mahryan Rakhmatullah
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter: ['*.png']
  # the server of a static site (a folder of plain HTML), run with the app's own Electron as Node
  - from: resources/static-server.cjs
    to: static-server.cjs
  # the licences of the open-source packages inside (Catzoid #66), opened from About → Third-party licences
  - from: resources/third-party-licenses.txt
    to: third-party-licenses.txt
# latest-mac.yml for in-app updates (Catzoid #54). The apps read it through the Catzoid site
# (<site>/updates/devcatz/, set at run time), which serves it from this repo's newest release.
publish:
  provider: github
  owner: catzoidhub
  repo: DevCatz
  releaseType: release
protocols:
  - name: DevCatz
    schemes: [devcatz]
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64]
    # What in-app updates install (Catzoid #54): the zip, its .blockmap and latest-mac.yml go on the release too.
    - target: zip
      arch: [arm64]
  # Signed with the Developer ID Application certificate in the login keychain
  # (electron-builder picks it up automatically).
  # Set CSC_IDENTITY_AUTO_DISCOVERY=false for an unsigned local build.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarized by scripts/package.mjs (bun run package) when the notarytool keychain
  # profile mrcatz-notary exists; the app is notarized + stapled here, the DMG after.
  notarize: true
  minimumSystemVersion: '13.0'
dmg:
  # Signed too, then notarized and stapled by scripts/package.mjs (Apple's recommended order).
  sign: true
  title: DevCatz ${version}
  artifactName: DevCatz-${version}-${arch}.${ext}
  # Drawn from scripts/dmg/background.svg (1× and @2x PNG; electron-builder joins them into a Retina TIFF).
  background: resources/dmg/background.png
  iconSize: 112
  iconTextSize: 13
  contents:
    - { x: 150, y: 190, type: file }
    - { x: 450, y: 190, type: link, path: /Applications }
  window: { width: 600, height: 400 }

# Windows x64 (Catzoid #57, stage 1), built on GitHub Actions (.github/workflows/release-windows.yml) and signed there
# by the SignPath Foundation once the project is approved (#16); until then only unsigned test builds for the VM.
win:
  icon: resources/icon.png # ≥ 256 × 256; electron-builder makes the .ico
  target:
    - target: nsis
      arch: [x64]
  # Sets the .exe's icon and version info; with no certificate configured nothing is signed here.
  signAndEditExecutable: true
nsis:
  oneClick: false
  # Per user: no administrator prompt, and in-app updates work without UAC.
  perMachine: false
  allowToChangeInstallationDirectory: true
  # What the Catzoid site's catalog matches (catalog.go winX64).
  artifactName: ${productName}-Setup-${version}.${ext}
  # The DevCatz look (drawn from scripts/installer/*.svg) and the Welcome / Shortcuts pages (resources/installer/installer.nsh).
  installerSidebar: resources/installer/sidebar.bmp
  uninstallerSidebar: resources/installer/sidebar.bmp
  installerHeader: resources/installer/header.bmp
  include: resources/installer/installer.nsh
  shortcutName: DevCatz
  # Asked on the Shortcuts page instead (installer.nsh); the Start menu entry is always made.
  createDesktopShortcut: false
  createStartMenuShortcut: true
  uninstallDisplayName: ${productName}

linux:
  icon: resources/icon.png
  category: Development
  maintainer: Mahryan Rakhmatullah <109191921+ryankucingg@users.noreply.github.com>
  executableName: devcatz
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  synopsis: Your whole local stack, herded by one cat
  description: Sites on https://*.localhost with the right runtime each, databases, mail, storage, search and Docker in one window.
  # The menu entry: a proper name, search words and the devcatz:// handler (protocols above).
  desktop:
    entry:
      Name: DevCatz
      GenericName: Local development environment
      Comment: Sites, runtimes, databases and services for every stack
      Keywords: php;laravel;node;localhost;database;docker;dev;
  # The window belongs to this menu entry (app_id / WM_CLASS = devcatz.desktop's name).
  syncDesktopName: true
deb:
  # App Center / GNOME Software read this when the .deb is opened: summary, description, screenshots, brand colours.
  fpm:
    - resources/linux/com.mrcatz.devcatz.metainfo.xml=/usr/share/metainfo/com.mrcatz.devcatz.metainfo.xml
  # Without them the app does not start on a fresh Ubuntu (libgbm.so.1); the rest as electron-builder's defaults.
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libgbm1, libasound2t64 | libasound2]

# No native modules to compile: ssh2's optional cpu-features / crypto bindings fall back to pure JS.
npmRebuild: false

# The AppImage runtime 20251108 (static, fusermount3): Ubuntu 24.04 and newer ship no libfuse2, and the old runtime
# stopped there with "AppImages require FUSE to run" before DevCatz could open (seen in the VM, 2026-11-09).
toolsets:
  appimage: 1.0.3
