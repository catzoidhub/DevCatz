name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag in main history
        required: true
        type: string
      upload:
        description: Publish retained Windows assets to an existing release without replacing files
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Allowlist this exact reusable workflow SHA in the runner group, never this dispatcher.
    uses: catzoidhub/DevCatz/.github/workflows/build-windows-release.yml@1c15830e964380fbf92647315475f6cac1e3ca97
    permissions:
      # The reusable workflow downgrades authorization/build to read; only publication uses write.
      contents: write
    with:
      tag: ${{ inputs.tag }}
      upload: ${{ inputs.upload }}
    secrets:
      DEVCATZ_MEMBERS_READ_TOKEN: ${{ secrets.DEVCATZ_MEMBERS_READ_TOKEN }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
