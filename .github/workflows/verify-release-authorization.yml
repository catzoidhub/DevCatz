name: Temporary release authorization evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [dispatch, failed, job]

permissions:
  actions: write

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const { owner, repo } = context.repo;
            if (owner !== 'catzoidhub' || repo !== 'DevCatz') throw new Error('Unexpected repository');
            const mode = process.env.MODE;
            if (!['dispatch', 'failed', 'job'].includes(mode)) throw new Error('Invalid mode');
            const targets = [
              { run_id: 42379287282, workflow: 'release-windows.yml', job: 'release / windows' },
              { run_id: 42379289863, workflow: 'release-linux.yml', job: 'linux / linux' }
            ];
            if (mode === 'dispatch') {
              for (const target of targets) {
                await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
                  owner, repo, workflow_id: target.workflow, ref: 'main',
                  inputs: { tag: 'v1.1.0-ci.20261107.132814', upload: 'false' }
                });
              }
            } else {
              for (const target of targets.filter(t => mode !== 'job' || t.workflow === 'release-linux.yml')) {
                const { data: run } = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}', { owner, repo, run_id: target.run_id });
                if (run.path !== `.github/workflows/${target.workflow}` || run.actor.login !== 'sizoune' || run.status !== 'completed' || run.head_branch !== 'main') throw new Error('Unexpected controlled run');
                if (mode === 'failed') {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs', { owner, repo, run_id: target.run_id });
                } else {
                  const { data } = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs', { owner, repo, run_id: target.run_id });
                  const job = data.jobs.find(j => j.name === target.job && j.status === 'completed');
                  if (!job) throw new Error('Controlled completed job missing');
                  await github.request('POST /repos/{owner}/{repo}/actions/jobs/{job_id}/rerun', { owner, repo, job_id: job.id });
                }
              }
            }
