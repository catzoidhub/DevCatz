name: Check dedicated release runners

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag in main history
        required: true
        type: string

permissions:
  contents: read

jobs:
  readiness:
    # The runner group must allow this exact reusable workflow SHA, not this dispatcher.
    uses: catzoidhub/DevCatz/.github/workflows/runner-readiness.yml@6b3a2beedb60c94847ccffb67744850d2115451e
    with:
      tag: ${{ inputs.tag }}
