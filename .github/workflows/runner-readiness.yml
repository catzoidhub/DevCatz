name: Dedicated runner readiness (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to validate
        required: true
        type: string
    secrets:
      DEVCATZ_MEMBERS_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: devcatz-release
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        uses: catzoidhub/DevCatz/.github/actions/validate-release@3f634e3bff1bd67ab81ec4044a2effe4e193c3e5
        with:
          policy-ready: ${{ vars.DEVCATZ_RUNNER_POLICY_READY }}
          tag: ${{ inputs.tag }}
          membership-token: ${{ secrets.DEVCATZ_MEMBERS_READ_TOKEN }}
          github-token: ${{ github.token }}

  readiness:
    needs: authorize
    environment: devcatz-release
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            label: devcatz-linux-x64
          - os: Windows
            label: devcatz-windows-x64
    runs-on:
      group: devcatz-release
      labels: [self-hosted, '${{ matrix.os }}', X64, devcatz, '${{ matrix.label }}']
    steps:
      # A failed-job rerun can retain authorize's outputs. Check both actors again here.
      - id: source
        uses: catzoidhub/DevCatz/.github/actions/validate-release@3f634e3bff1bd67ab81ec4044a2effe4e193c3e5
        with:
          policy-ready: ${{ vars.DEVCATZ_RUNNER_POLICY_READY }}
          tag: ${{ inputs.tag }}
          expected-sha: ${{ needs.authorize.outputs.sha }}
          membership-token: ${{ secrets.DEVCATZ_MEMBERS_READ_TOKEN }}
          github-token: ${{ github.token }}
      - name: Check dedicated account and installed tools
        uses: catzoidhub/DevCatz/.github/actions/runner-readiness@a056b5ddcbe378bca0fb678023b22cc05ca0ae67
        with:
          expected-user: ${{ matrix.os == 'Linux' && vars.DEVCATZ_LINUX_RUNNER_USER || vars.DEVCATZ_WINDOWS_RUNNER_USER }}
