name: Release Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag in main history
        required: true
        type: string
      upload:
        description: Publish Linux packages and update metadata without replacing assets
        type: boolean
        default: false

# The reusable workflow limits build/authorization jobs to read; only opt-in publication writes.
permissions:
  contents: write

jobs:
  linux:
    if: github.ref == 'refs/heads/main'
    # Allowlist this exact reusable workflow SHA in the runner group, never this wrapper.
    # Publication's placeholder pin inside it must be resolved and this pin updated before enabling.
    uses: catzoidhub/DevCatz/.github/workflows/build-linux-release.yml@d8732012303204bcade550a3288e8262c529fb40
    with:
      tag: ${{ inputs.tag }}
      upload: ${{ inputs.upload }}
