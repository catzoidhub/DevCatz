name: Idea
description: Something DevCatz could do, or do better.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: >
        Ideas are welcome here — or **Help → Send Feedback…** inside DevCatz. Big ones are talked through here before anyone builds them.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job, not the solution yet — "I switch PHP versions per site by hand".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: How you get by today, sketches, screenshots.
