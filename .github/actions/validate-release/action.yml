name: Validate owner-authorized release source
description: Fail closed on caller, current owner membership, source or runner-policy prerequisites
inputs:
  tag:
    description: Existing v-prefixed tag matching package.json
    required: true
  policy-ready:
    description: Runner-policy attestation supplied by the pinned workflow's repository variable
    required: true
  expected-sha:
    description: Previously validated SHA; mandatory on persistent hosts
    required: false
    default: ''
  membership-token:
    description: Dedicated catzoidhub Members-read credential, never the default workflow token
    required: true
  github-token:
    description: Repository contents-read workflow token
    required: true
outputs:
  sha:
    description: Immutable validated source commit
    value: ${{ steps.validate.outputs.sha }}
  tag:
    description: Validated tag
    value: ${{ steps.validate.outputs.tag }}
  version:
    description: Application manifest version at the validated commit
    value: ${{ steps.validate.outputs.version }}
runs:
  using: composite
  steps:
    - id: validate
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        RELEASE_ACTION_PATH: ${{ github.action_path }}
        RELEASE_EVENT: ${{ github.event_name }}
        RELEASE_REF: ${{ github.ref }}
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_ACTOR: ${{ github.actor }}
        RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        RELEASE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        RELEASE_POLICY_READY: ${{ inputs.policy-ready }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_EXPECTED_SHA: ${{ inputs.expected-sha }}
        RELEASE_MEMBERSHIP_TOKEN: ${{ inputs.membership-token }}
        RELEASE_GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { validateRelease } = require(`${process.env.RELEASE_ACTION_PATH}/validate.cjs`)
          const result = await validateRelease({
            eventName: process.env.RELEASE_EVENT, ref: process.env.RELEASE_REF,
            repository: process.env.RELEASE_REPOSITORY, actor: process.env.RELEASE_ACTOR,
            triggeringActor: process.env.RELEASE_TRIGGERING_ACTOR,
            runnerEnvironment: process.env.RELEASE_RUNNER_ENVIRONMENT,
            policyReady: process.env.RELEASE_POLICY_READY, tag: process.env.RELEASE_TAG,
            expectedSha: process.env.RELEASE_EXPECTED_SHA
          }, { membershipToken: process.env.RELEASE_MEMBERSHIP_TOKEN, githubToken: process.env.RELEASE_GITHUB_TOKEN })
          for (const [name, value] of Object.entries(result)) core.setOutput(name, value)
          core.info(`Validated ${result.tag} at ${result.sha}`)
