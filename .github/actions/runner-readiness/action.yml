name: Check dedicated DevCatz runner
description: Check account, architecture, temporary storage and installed Electron build prerequisites
inputs:
  expected-user:
    description: Linux login or Windows MACHINE\login from whoami
    required: true
runs:
  using: composite
  steps:
    - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        READINESS_ACTION_PATH: ${{ github.action_path }}
        READINESS_EXPECTED_USER: ${{ inputs.expected-user }}
      with:
        script: |
          const { checkRunner } = require(`${process.env.READINESS_ACTION_PATH}/check.cjs`)
          const result = checkRunner({ expectedUser: process.env.READINESS_EXPECTED_USER, temp: process.env.RUNNER_TEMP })
          core.info(JSON.stringify(result, null, 2))
